[mod]
id = "cortescombatspatialguifix"
name = "Cortes combat spatial gui fix"
group = "dev.nanleb"
version = "0.1.0"
channel_tag = "-alpha.2"
description = "Example Description"
authors = ["NanLeb", "AnotherNanLeb"]
contributors = ["ContributorName", "AnotherContributorName"]
inception_year = "2025"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/rotgruengelb/stonecutter-mod-template"
homepage_url = "https://github.com/rotgruengelb/stonecutter-mod-template"
issues_url = "https://github.com/rotgruengelb/stonecutter-mod-template/issues"
discord_url = "https://discord.gg/aunYJB4wz9"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]

[[mod.pom.developers]]
id = "NanLeb"
name = "NanLeb"
url = "https://github.com/ghost"
[[mod.pom.developers]]
id = "anotherNanLeb"
name = "AnotherNanLeb"
url = "https://github.com/ghost"

[forge]

[forge."1.20.1"]
deps.minecraft = "1.20.1"
deps.forge = "47.4.28"
deps.cortescombat = "1.6.0"
deps.spatial-gui = "1.11.0-forge+1.20.1"
deps.yacl = "3.6.6+1.20.1-forge"
mod.environment = "client_only"

[neoforge]

[neoforge."1.21.1"]
deps.minecraft = "1.21.1"
deps.neoforge = "21.1.250"
deps.cortescombat = "1.6.0"
deps.spatial-gui = "1.11.0-neoforge+1.21.1"
deps.yacl = "3.8.2+1.21.1-neoforge"
mod.environment = "client_only"
